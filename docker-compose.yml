# ============================================================
# TODO App – Phala CVM Deployment (docker-compose.yml)
# Last updated: 2026-07-13
#
# HOW TO DEPLOY:
#   Images are already built and pushed to Docker Hub as kairu1206/cvm-*.
#   To rebuild after code changes:
#        docker build -t kairu1206/cvm-backend:latest   ./services/backend  && docker push kairu1206/cvm-backend:latest
#        docker build -t kairu1206/cvm-ai:latest        ./services/ai_inference && docker push kairu1206/cvm-ai:latest
#        docker build -t kairu1206/cvm-sync:latest      ./services/task_sync    && docker push kairu1206/cvm-sync:latest
#        docker build -t kairu1206/cvm-scheduler:latest ./services/scheduler    && docker push kairu1206/cvm-scheduler:latest
#        docker build -t kairu1206/cvm-webui:latest ./services/web_ui && docker push kairu1206/cvm-webui:latest
#
#   1. Paste this file into https://cloud.phala.com → Create CVM → Advanced tab.
#   2. Set ALL env vars marked [SECURE] in the Phala dashboard "Environment Variables" panel.
#
# PUBLIC HTTPS ENDPOINTS (automatically provisioned by Phala after deploy):
#   Backend storage:  https://<app-id>-5000.dstack-prod5.phala.network
#   AI inference:     https://<app-id>-5001.dstack-prod5.phala.network
#   Task sync:        https://<app-id>-5002.dstack-prod5.phala.network
#   Scheduler:        https://<app-id>-5003.dstack-prod5.phala.network
#
# NOTE: Nginx is NOT included – Phala provides automatic TLS for every exposed port.
# NOTE: All services share one CVM (same TEE boundary) and talk via service names internally.
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL – shared database for all backend services
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cvm_todoapp
      POSTGRES_USER: ${DB_USER:-cvm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}      # [SECURE] – set this in the Phala dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres is internal only – do NOT expose it publicly on Phala
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-cvm_user} -d ${POSTGRES_DB:-cvm_todoapp}"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend Storage Service
  # Internal URL: http://backend:5000
  # Public HTTPS:  https://<app-id>-5000.dstack-prod5.phala.network
  # ----------------------------------------------------------
  backend:
    image: kairu1206/cvm-backend:latest
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cvm_user}:${DB_PASSWORD}@postgres:5432/cvm_todoapp
      API_KEY: ${API_KEY}                              # [SECURE] – Phala dashboard
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}               # [SECURE] – Phala dashboard
      JWT_SECRET: ${JWT_SECRET}                       # [SECURE] – required for account sessions
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}        # Comma-separated Web/Desktop OAuth client IDs
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}                  # [SECURE] – Gmail App Password
      OPENCLAW_WEBHOOK_SECRET: ${OPENCLAW_WEBHOOK_SECRET} # [SECURE] – authenticates meeting proposals
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------
  # OpenClaw – self-hosted email/meeting automation gateway
  # Control UI: http://localhost:18789 (protect with gateway token)
  # Complete onboarding before enabling Gmail Pub/Sub hooks.
  # ----------------------------------------------------------
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    ports:
      - "18789:18789"
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}       # [SECURE]
      OPENCLAW_TZ: ${OPENCLAW_TZ:-America/New_York}
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_GATEWAY_MODE: ${OPENCLAW_GATEWAY_MODE:-local}
      OPENCLAW_PUBLIC_ORIGIN: ${OPENCLAW_PUBLIC_ORIGIN:-}
      OPENCLAW_ALLOWED_ORIGINS: ${OPENCLAW_ALLOWED_ORIGINS:-https://cloud.phala.com,http://localhost:18789}
      TODO_MEETING_WEBHOOK_URL: http://backend:5000/integrations/openclaw/meetings
      TODO_MEETING_WEBHOOK_SECRET: ${OPENCLAW_WEBHOOK_SECRET} # [SECURE]
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}                     # Optional model provider
    command:
      - sh
      - -lc
      - |
        node -e "const fs=require('fs'); const path='/home/node/.openclaw/openclaw.json'; let cfg={}; try{cfg=JSON.parse(fs.readFileSync(path,'utf8'));}catch{} const fromList=(process.env.OPENCLAW_ALLOWED_ORIGINS||'').split(',').map(s=>s.trim()).filter(Boolean); const pub=(process.env.OPENCLAW_PUBLIC_ORIGIN||'').trim(); const allowed=[...new Set([...fromList, ...(pub?[pub]:[])])]; cfg.gateway=cfg.gateway||{}; cfg.gateway.mode=(process.env.OPENCLAW_GATEWAY_MODE||'local').trim()||'local'; cfg.gateway.controlUi=cfg.gateway.controlUi||{}; cfg.gateway.controlUi.allowedOrigins=allowed; fs.mkdirSync('/home/node/.openclaw',{recursive:true}); fs.writeFileSync(path, JSON.stringify(cfg,null,2));"
        exec node dist/index.js gateway --bind lan --port 18789 --allow-unconfigured
    init: true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - openclaw_data:/home/node/.openclaw
      - openclaw_auth:/home/node/.config/openclaw
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------
  # AI Inference Service
  # Queries Ollama internally – your prompts never leave the TEE
  # Internal URL: http://ai_inference:5001
  # Public HTTPS:  https://<app-id>-5001.dstack-prod5.phala.network
  # ----------------------------------------------------------
  ai_inference:
    image: kairu1206/cvm-ai:latest
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cvm_user}:${DB_PASSWORD}@postgres:5432/cvm_todoapp
      API_KEY: ${API_KEY}                              # [SECURE] – Phala dashboard
      
      PHALA_AI_URL: https://inference.phala.com/v1/chat/completions
      PHALA_AI_API_KEY: ${PHALA_AI_API_KEY}
      PHALA_AI_MODEL: ${PHALA_AI_MODEL:-deepseek/deepseek-v4-flash}

      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ai_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Task Sync Service
  # P2P encrypted task sharing between users
  # Internal URL: http://task_sync:5002
  # Public HTTPS:  https://<app-id>-5002.dstack-prod5.phala.network
  # ----------------------------------------------------------
  task_sync:
    image: kairu1206/cvm-sync:latest
    ports:
      - "5002:5002"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cvm_user}:${DB_PASSWORD}@postgres:5432/cvm_todoapp
      API_KEY: ${API_KEY}                              # [SECURE] – Phala dashboard
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}               # [SECURE] – Phala dashboard
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sync_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Scheduler Service
  # Background jobs (email/SMS reminders, cleanup, auto-sync)
  # Internal URL: http://scheduler:5003
  # Public HTTPS:  https://<app-id>-5003.dstack-prod5.phala.network
  # ----------------------------------------------------------
  scheduler:
    image: kairu1206/cvm-scheduler:latest
    ports:
      - "5003:5003"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cvm_user}:${DB_PASSWORD}@postgres:5432/cvm_todoapp
      API_KEY: ${API_KEY}                              # [SECURE] – Phala dashboard
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}                  # [SECURE] – Gmail App Password
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}      # Optional – required only for SMS reminders
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}        # [SECURE] – optional Twilio credential
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}      # Optional E.164 sender, e.g. +15551234567
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - scheduler_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Web UI – browser-based frontend matching the Python desktop app
  # Tabs: Tasks, Daily Tasks, AI Assistant, Calendar, Weekly, Settings
  # Public HTTPS: https://<app-id>-8080.dstack-pha-prod9.phala.network
  # ----------------------------------------------------------
  web_ui:
    image: kairu1206/cvm-webui:latest
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL:   http://backend:5000
      AI_URL:        http://ai_inference:5001
      SYNC_URL:      http://task_sync:5002
      SCHEDULER_URL: http://scheduler:5003
      OPENCLAW_URL:  http://openclaw:18789
      API_KEY:       ${API_KEY}             # [SECURE] – Phala dashboard (same key as other services)
      SECRET_KEY:    ${WEB_SECRET_KEY}      # [SECURE] – Flask session signing key
      WEB_USER_ID:   ${WEB_USER_ID:-}       # Optional: set to match your desktop user ID
      ENVIRONMENT:   production
      LOG_LEVEL:     ${LOG_LEVEL:-info}
    depends_on:
      - backend
      - ai_inference
    volumes:
      - webui_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

# ----------------------------------------------------------
# Named volumes – persisted inside the CVM's encrypted storage
# ----------------------------------------------------------
volumes:
  postgres_data:
  backend_data:
  ai_data:
  sync_data:
  scheduler_data:
  webui_data:
  openclaw_data:
  openclaw_auth:
