# ============================================================
# TODO App – Phala CVM Deployment (docker-compose.yml)
# Last updated: 2026-07-13
#
# HOW TO DEPLOY:
#   Images are already built and pushed to Docker Hub as kairu1206/cvm-*.
#   To rebuild after code changes:
#        docker build -t kairu1206/cvm-backend:latest   ./services/backend  && docker push kairu1206/cvm-backend:latest
#        docker build -t kairu1206/cvm-ai:latest        ./services/ai_inference && docker push kairu1206/cvm-ai:latest
#        docker build -t kairu1206/cvm-sync:latest      ./services/task_sync    && docker push kairu1206/cvm-sync:latest
#        docker build -t kairu1206/cvm-scheduler:latest ./services/scheduler    && docker push kairu1206/cvm-scheduler:latest
#        docker build -t kairu1206/cvm-webui:latest ./services/web_ui && docker push kairu1206/cvm-webui:latest
#        docker build -t kairu1206/cvm-openclaw:latest ./services/openclaw && docker push kairu1206/cvm-openclaw:latest
#        docker build -t kairu1206/cvm-wallet:latest ./services/wallet && docker push kairu1206/cvm-wallet:latest
#
#   1. Paste this file into https://cloud.phala.com → Create CVM → Advanced tab.
#   2. Set ALL env vars marked [SECURE] in the Phala dashboard "Environment Variables" panel.
#
# PUBLIC HTTPS ENDPOINTS (automatically provisioned by Phala after deploy):
#   Backend storage:  https://<app-id>-5000.dstack-prod5.phala.network
#   AI inference:     https://<app-id>-5001.dstack-prod5.phala.network
#   Task sync:        https://<app-id>-5002.dstack-prod5.phala.network
#   Scheduler:        https://<app-id>-5003.dstack-prod5.phala.network
#
# NOTE: Nginx is NOT included – Phala provides automatic TLS for every exposed port.
# NOTE: All services share one CVM (same TEE boundary) and talk via service names internally.
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL – shared database for all backend services
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cvm_todoapp
      POSTGRES_USER: ${DB_USER:-cvm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}      # [SECURE] – set this in the Phala dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres is internal only – do NOT expose it publicly on Phala
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-cvm_user} -d ${POSTGRES_DB:-cvm_todoapp}"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Controlled Base Sepolia wallet service
  # Internal only: derives per-user addresses and signs policy-bound native
  # testnet transfers through dstack. No arbitrary signing or public port.
  # ----------------------------------------------------------
  wallet:
    image: kairu1206/cvm-wallet:latest
    expose:
      - "5004"
    environment:
      API_KEY: ${API_KEY}                              # [SECURE] - internal service authentication
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WALLET_NAMESPACE: ${WALLET_NAMESPACE:-todoapp-wallet}
      # SECURITY: never change this after funding an address; use a migration instead.
      WALLET_DERIVATION_VERSION: ${WALLET_DERIVATION_VERSION:-v1}
      WALLET_CHAIN_ID: ${WALLET_CHAIN_ID:-84532}
      WALLET_CHAIN_NAME: ${WALLET_CHAIN_NAME:-Base Sepolia}
      WALLET_NATIVE_SYMBOL: ${WALLET_NATIVE_SYMBOL:-ETH}
      WALLET_RPC_URL: ${WALLET_RPC_URL:-https://sepolia.base.org}
      WALLET_EXPLORER_API_URL: ${WALLET_EXPLORER_API_URL:-https://base-sepolia.blockscout.com/api/v2}
      WALLET_EXPLORER_URL: ${WALLET_EXPLORER_URL:-https://base-sepolia.blockscout.com}
      # Version 3 is hard-restricted to Base Sepolia native ETH transfers and
      # the single allowlisted task escrow contract configured below.
      WALLET_SEND_ENABLED: ${WALLET_SEND_ENABLED:-true}
      WALLET_MAX_TRANSFER_ETH: ${WALLET_MAX_TRANSFER_ETH:-0.1}
      WALLET_MAX_FEE_GWEI: ${WALLET_MAX_FEE_GWEI:-5}
      WALLET_QUOTE_TTL_SECONDS: ${WALLET_QUOTE_TTL_SECONDS:-600}
      # XP works without a contract. Enable badges only after deploying the
      # allowlisted non-transferable contract described in REWARDS.md.
      REWARD_BADGES_ENABLED: ${REWARD_BADGES_ENABLED:-false}
      REWARD_BADGE_CONTRACT_ADDRESS: ${REWARD_BADGE_CONTRACT_ADDRESS:-}
      REWARD_MAX_GAS: ${REWARD_MAX_GAS:-200000}
      # V3 task escrow remains off until TaskRewardEscrow.sol is deployed.
      TASK_ESCROW_ENABLED: ${TASK_ESCROW_ENABLED:-false}
      TASK_ESCROW_CONTRACT_ADDRESS: ${TASK_ESCROW_CONTRACT_ADDRESS:-}
      TASK_ESCROW_MAX_ETH: ${TASK_ESCROW_MAX_ETH:-0.05}
      TASK_ESCROW_MAX_GAS: ${TASK_ESCROW_MAX_GAS:-250000}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend Storage Service
  # Internal URL: http://backend:5000
  # Public HTTPS:  https://<app-id>-5000.dstack-prod5.phala.network
  # ----------------------------------------------------------
  backend:
    image: kairu1206/cvm-backend:latest
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cvm_user}:${DB_PASSWORD}@postgres:5432/cvm_todoapp
      API_KEY: ${API_KEY}                              # [SECURE] – Phala dashboard
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}               # [SECURE] – Phala dashboard
      JWT_SECRET: ${JWT_SECRET}                       # [SECURE] – required for account sessions
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}        # Comma-separated Web/Desktop OAuth client IDs
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}                  # [SECURE] – Gmail App Password
      OPENCLAW_WEBHOOK_SECRET: ${OPENCLAW_WEBHOOK_SECRET} # [SECURE] – authenticates meeting proposals
      WALLET_URL: http://wallet:5004
      WALLET_SEND_ENABLED: ${WALLET_SEND_ENABLED:-true}
      WALLET_MAX_TRANSFER_ETH: ${WALLET_MAX_TRANSFER_ETH:-0.1}
      WALLET_DAILY_LIMIT_ETH: ${WALLET_DAILY_LIMIT_ETH:-0.25}
      WALLET_PREPARE_LIMIT_PER_HOUR: ${WALLET_PREPARE_LIMIT_PER_HOUR:-10}
      WALLET_EXPLORER_URL: ${WALLET_EXPLORER_URL:-https://base-sepolia.blockscout.com}
      REWARD_XP_PER_TASK: ${REWARD_XP_PER_TASK:-10}
      REWARD_XP_PER_LEVEL: ${REWARD_XP_PER_LEVEL:-50}
      REWARD_BADGES_ENABLED: ${REWARD_BADGES_ENABLED:-false}
      REWARD_BADGE_CONTRACT_ADDRESS: ${REWARD_BADGE_CONTRACT_ADDRESS:-}
      TASK_ESCROW_ENABLED: ${TASK_ESCROW_ENABLED:-false}
      TASK_ESCROW_MAX_ETH: ${TASK_ESCROW_MAX_ETH:-0.05}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      wallet:
        condition: service_started
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------
  # OpenClaw – self-hosted email/meeting automation gateway
  # Control UI: http://localhost:18789 (protect with gateway token)
  # Complete onboarding before enabling Gmail Pub/Sub hooks.
  # ----------------------------------------------------------
  openclaw:
    image: kairu1206/cvm-openclaw:latest
    ports:
      - "18789:18789"
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}       # [SECURE]
      OPENCLAW_TZ: ${OPENCLAW_TZ:-America/New_York}
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_GATEWAY_MODE: ${OPENCLAW_GATEWAY_MODE:-local}
      OPENCLAW_PUBLIC_ORIGIN: ${OPENCLAW_PUBLIC_ORIGIN:-}
      OPENCLAW_ALLOWED_ORIGINS: ${OPENCLAW_ALLOWED_ORIGINS:-https://cloud.phala.com,http://localhost:18789}
      TODO_MEETING_WEBHOOK_URL: http://backend:5000/integrations/openclaw/meetings
      TODO_MEETING_WEBHOOK_SECRET: ${OPENCLAW_WEBHOOK_SECRET} # [SECURE]
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}                     # Optional model provider
      PHALA_AI_API_KEY: ${PHALA_AI_API_KEY}                   # [SECURE] – confidential inference credential
      OPENCLAW_CONFIDENTIAL_AI_ENABLED: ${OPENCLAW_CONFIDENTIAL_AI_ENABLED:-false}
      OPENCLAW_CONFIDENTIAL_AI_BASE_URL: ${OPENCLAW_CONFIDENTIAL_AI_BASE_URL:-https://inference.phala.com/v1}
      OPENCLAW_CONFIDENTIAL_AI_MODEL: ${OPENCLAW_CONFIDENTIAL_AI_MODEL:-deepseek/deepseek-v4-flash}
      OPENCLAW_CONFIDENTIAL_AI_ALIAS: ${OPENCLAW_CONFIDENTIAL_AI_ALIAS:-Phala Confidential}
      OPENCLAW_CONFIDENTIAL_AI_TIMEOUT_SECONDS: ${OPENCLAW_CONFIDENTIAL_AI_TIMEOUT_SECONDS:-300}
    command:
      - sh
      - -lc
      - |
        node /opt/todoapp/configure-openclaw.mjs
        exec node dist/index.js gateway --bind lan --port 18789 --allow-unconfigured
    init: true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - openclaw_data:/home/node/.openclaw
      - openclaw_auth:/home/node/.config/openclaw
      - clawdi_data:/home/node/.clawdi
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Clawdi connector - optional cloud memory/MCP/session layer
  # This does not replace OpenClaw and exposes no public port.
  # Authenticate it interactively after the first deployment.
  # ----------------------------------------------------------
  clawdi_connector:
    image: kairu1206/cvm-openclaw:latest
    environment:
      HOME: /home/node
      CLAWDI_HOME: /home/node/.clawdi
      # Match the gateway container exactly so Clawdi resolves the same
      # OpenClaw roster, main agent, sessions, skills, and workspace.
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_AGENT_ID: main
      # The connector is a separate container, so OpenClaw CLI gateway calls
      # must target the gateway service instead of this container's loopback.
      OPENCLAW_GATEWAY_URL: ws://openclaw:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}       # [SECURE]
      CLAWDI_ENABLED: ${CLAWDI_ENABLED:-false}
      # The CLI is pinned in the image; updates happen through reviewed rebuilds.
      CLAWDI_NO_AUTO_UPDATE: "1"
    command:
      - sh
      - -lc
      - |
        if ! echo "$${CLAWDI_ENABLED}" | grep -Eiq '^(1|true|yes|on)$'; then
          echo "Clawdi connector disabled; set CLAWDI_ENABLED=true after authentication."
          exec tail -f /dev/null
        fi
        while true; do
          clawdi daemon run
          code=$$?
          echo "Clawdi daemon exited with status $$code; retrying in 30 seconds."
          sleep 30
        done
    init: true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - openclaw_data:/home/node/.openclaw
      - openclaw_auth:/home/node/.config/openclaw
      - clawdi_data:/home/node/.clawdi
    depends_on:
      openclaw:
        condition: service_healthy
    # Override the shared image's port-18789 healthcheck: this companion has no
    # HTTP listener. Keep the check authentication-independent so the service
    # can start safely while CLAWDI_ENABLED is false during initial setup.
    healthcheck:
      test: ["CMD", "clawdi", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------
  # AI Inference Service
  # Queries Ollama internally – your prompts never leave the TEE
  # Internal URL: http://ai_inference:5001
  # Public HTTPS:  https://<app-id>-5001.dstack-prod5.phala.network
  # ----------------------------------------------------------
  ai_inference:
    image: kairu1206/cvm-ai:latest
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cvm_user}:${DB_PASSWORD}@postgres:5432/cvm_todoapp
      API_KEY: ${API_KEY}                              # [SECURE] – Phala dashboard
      
      PHALA_AI_URL: https://inference.phala.com/v1/chat/completions
      PHALA_AI_API_KEY: ${PHALA_AI_API_KEY}
      PHALA_AI_MODEL: ${PHALA_AI_MODEL:-deepseek/deepseek-v4-flash}

      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ai_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Task Sync Service
  # P2P encrypted task sharing between users
  # Internal URL: http://task_sync:5002
  # Public HTTPS:  https://<app-id>-5002.dstack-prod5.phala.network
  # ----------------------------------------------------------
  task_sync:
    image: kairu1206/cvm-sync:latest
    ports:
      - "5002:5002"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cvm_user}:${DB_PASSWORD}@postgres:5432/cvm_todoapp
      API_KEY: ${API_KEY}                              # [SECURE] – Phala dashboard
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}               # [SECURE] – Phala dashboard
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sync_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Scheduler Service
  # Background jobs (email/SMS reminders, cleanup, auto-sync)
  # Internal URL: http://scheduler:5003
  # Public HTTPS:  https://<app-id>-5003.dstack-prod5.phala.network
  # ----------------------------------------------------------
  scheduler:
    image: kairu1206/cvm-scheduler:latest
    ports:
      - "5003:5003"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cvm_user}:${DB_PASSWORD}@postgres:5432/cvm_todoapp
      API_KEY: ${API_KEY}                              # [SECURE] – Phala dashboard
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}                  # [SECURE] – Gmail App Password
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}      # Optional – required only for SMS reminders
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}        # [SECURE] – optional Twilio credential
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}      # Optional E.164 sender, e.g. +15551234567
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - scheduler_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Web UI – browser-based frontend matching the Python desktop app
  # Tabs: Tasks, Daily Tasks, AI Assistant, Calendar, Weekly, Wallet, Settings
  # Public HTTPS: https://<app-id>-8080.dstack-pha-prod9.phala.network
  # ----------------------------------------------------------
  web_ui:
    image: kairu1206/cvm-webui:latest
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL:   http://backend:5000
      AI_URL:        http://ai_inference:5001
      SYNC_URL:      http://task_sync:5002
      SCHEDULER_URL: http://scheduler:5003
      OPENCLAW_URL:  http://openclaw:18789
      WALLET_URL:    http://wallet:5004
      API_KEY:       ${API_KEY}             # [SECURE] – Phala dashboard (same key as other services)
      SECRET_KEY:    ${WEB_SECRET_KEY}      # [SECURE] – Flask session signing key
      WEB_USER_ID:   ${WEB_USER_ID:-}       # Optional: set to match your desktop user ID
      ENVIRONMENT:   production
      LOG_LEVEL:     ${LOG_LEVEL:-info}
    depends_on:
      - backend
      - ai_inference
    volumes:
      - webui_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

# ----------------------------------------------------------
# Named volumes – persisted inside the CVM's encrypted storage
# ----------------------------------------------------------
volumes:
  postgres_data:
  backend_data:
  ai_data:
  sync_data:
  scheduler_data:
  webui_data:
  openclaw_data:
  openclaw_auth:
  clawdi_data:
