<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In – TODO App</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/login.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <h1 class="app-title">📋 TODO App</h1>
    <p class="login-subtitle" id="login-subtitle">Sign in to sync your tasks</p>

    <div id="login-error" class="login-error" style="display:none;"></div>

    <form id="auth-form" class="login-form">
      <div class="form-group">
        <label>Email</label>
        <input id="f-email" class="input" type="email" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="f-password" class="input" type="password" required autocomplete="current-password" minlength="8"/>
      </div>
      <div class="form-group" id="display-name-group" style="display:none;">
        <label>Display Name (optional)</label>
        <input id="f-display-name" class="input" type="text"/>
      </div>
      <button type="submit" class="btn btn-primary login-submit" id="submit-btn">Sign In</button>
    </form>

    <div class="login-toggle">
      <span id="toggle-text">Don't have an account?</span>
      <a href="#" id="toggle-mode">Create one</a>
    </div>
    <div class="login-forgot"><a href="#" id="forgot-link">Forgot password?</a></div>

  </div>

  <div id="verify-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h2>Verify your email</h2>
      <p class="help-text">Enter the six-digit code we sent to your email.</p>
      <div class="form-group"><label>Verification code</label><input id="verify-code" class="input" inputmode="numeric" maxlength="6" autocomplete="one-time-code"/></div>
      <div class="modal-actions"><button type="button" id="verify-btn" class="btn btn-primary">Verify</button><button type="button" class="btn" onclick="closeVerifyModal()">Cancel</button></div>
      <p id="verify-status" class="help-text"></p>
    </div>
  </div>

  <div id="reset-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h2>Reset Password</h2>
      <div id="reset-request-view">
        <div class="form-group">
          <label>Email</label>
          <input id="reset-email" class="input" type="email"/>
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary" onclick="requestReset()">Send Reset Link</button>
          <button class="btn" onclick="closeResetModal()">Cancel</button>
        </div>
      </div>
      <div id="reset-confirm-view" style="display:none;">
        <div class="form-group">
          <label>New Password</label>
          <input id="reset-new-password" class="input" type="password" minlength="8"/>
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary" onclick="confirmReset()">Set New Password</button>
        </div>
      </div>
      <p id="reset-status" class="help-text"></p>
    </div>
  </div>

  <script src="/static/login.js"></script>
</body>
</html>
