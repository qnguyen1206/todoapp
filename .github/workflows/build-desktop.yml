name: Build and release desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish, such as v1.8.1 (leave blank to build only)'
        required: false
        type: string
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and release version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Set and validate version from release tag
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python .github/scripts/set_release_version.py

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            spec: todo.spec
            artifact: TODO-App-Windows-x64
          - os: macos-15-intel
            label: macOS Intel
            spec: todo-macos.spec
            artifact: TODO-App-macOS-Intel
          - os: macos-15
            label: macOS Apple Silicon
            spec: todo-macos.spec
            artifact: TODO-App-macOS-Apple-Silicon
          - os: ubuntu-22.04
            label: Linux x64
            spec: todo-linux.spec
            artifact: TODO-App-Linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # A manual release must build the exact commit referenced by its tag.
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Set and validate version from release tag
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python .github/scripts/set_release_version.py

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-desktop.txt

      - name: Build native app
        run: python -m PyInstaller --noconfirm --clean ${{ matrix.spec }}

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/todo.exe,README.md -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/TODO App.app" "${{ matrix.artifact }}.zip"

      - name: Package Linux app
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.artifact }}.tar.gz" todo

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release and upload native packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          release_kind=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_kind=(--prerelease)
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${release_kind[@]}"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release link
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: echo "### Released [$RELEASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)" >> "$GITHUB_STEP_SUMMARY"
